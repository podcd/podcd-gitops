# node-exporter runs on every host in this example

apiVersion: v1
kind: Pod
metadata:
  name: node-exporter
spec:
  restartPolicy: Always
  containers:
    - name: node-exporter
      image: docker.io/prom/node-exporter:v1.8.2
      ports:
        - containerPort: 9100
          hostPort: 9100
          hostIP: 127.0.0.1
