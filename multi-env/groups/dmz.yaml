# dmz is the public-facing zone: edge-api is published on all interfaces on
# 443, with a stricter health check befitting something the internet can
# reach. This is structural (which port, which interface), so it is an
# override, not a value - it is the same for dmz-dev and dmz-prd.
#
# publicHostname, by contrast, is a value every dmz host shares regardless of
# environment, so it lives here, in this Group's own `values:`.
apiVersion: gitops.podcd.io/v1
kind: Group
metadata:
  name: dmz
spec:
  applications:
    - edge-api
    - node-exporter
  values:
    - values/zones/dmz.yaml
  overrides:
    edge-api:
      spec:
        containers:
          - name: edge-api
            ports:
              - containerPort: 8443
                hostPort: 443
