# Reference only: this is NOT a GitOps document (no apiVersion/kind, so the
# podcd loader ignores it) and podcd never reads it from Git. It belongs on
# the dmz-dev VM itself, at ~/.config/podcd/agent.yaml, installed by
# `podcd install` or `podcd config create` and edited with `podcd config set`.
#
# Notice how little is host-specific: which host, which repo, and one
# universal fallback value. Which environment and which zone this host is -
# and the values that go with them - are declared in Git instead, on the
# Environment and Group documents this Host selects (environments/dev.yaml,
# groups/dmz.yaml), not here. agent.yaml stays a pointer, fire-and-forget.
host: dmz-dev
repositories:
  - name: gitops
    url: https://github.com/podcd/podcd-gitops.git
    path: multi-env
    revision: main
    values:
      - values/common.yaml
