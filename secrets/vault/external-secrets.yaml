# Fetch individual keys from a KV v2 path:
#   remoteRef.key      = mount/path  (e.g. "secret/demo/db")
#   remoteRef.property = field name within that KV secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-db
spec:
  secretStoreRef:
    name: vault-dev
  target:
    name: demo-db
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/demo/db
        property: password
    - secretKey: DB_USERNAME
      remoteRef:
        key: secret/demo/db
        property: username
---
# Extract every field from a KV path at once with dataFrom:
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-api
spec:
  secretStoreRef:
    name: vault-dev
  target:
    name: demo-api
  dataFrom:
    - extract:
        key: secret/demo/api   # all KV fields become Secret keys
