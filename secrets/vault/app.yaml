apiVersion: v1
kind: Pod
metadata:
  name: demo-app
spec:
  restartPolicy: Always
  containers:
    # Pin to a digest in production: docker.io/library/busybox@sha256:...
    - name: demo
      image: docker.io/library/busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "=== secrets from vault ==="
          echo "DB_PASSWORD  set: $(test -n "$DB_PASSWORD"  && echo yes || echo NO)"
          echo "DB_USERNAME  set: $(test -n "$DB_USERNAME"  && echo yes || echo NO)"
          echo "api_key      set: $(test -n "$api_key"      && echo yes || echo NO)"
          sleep 3600
      envFrom:
        - secretRef:
            name: demo-db
        - secretRef:
            name: demo-api
