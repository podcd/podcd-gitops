apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-dev
spec:
  provider:
    vault:
      server: http://127.0.0.1:8200
      kvVersion: 2
      auth:
        tokenSecretRef:
          name: env:VAULT_TOKEN   # resolved from agent.env, never stored in Git
---
# The shape to use outside a dev box: a role id and secret id instead of a
# static root token. Both are references resolved from agent.env, so neither
# the credentials nor the secrets they unlock are ever in Git.
#
# Nothing in this example points at this store, and a store nobody references
# is never contacted - the agent only fetches what the workloads on *this* host
# actually name. Point an ExternalSecret's secretStoreRef here to use it.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-approle
spec:
  provider:
    vault:
      server: https://vault.example.com
      kvVersion: 2
      # caCert: /etc/pki/vault-ca.pem   # for a private CA
      auth:
        appRole:
          roleId: env:VAULT_ROLE_ID
          secretRef:
            name: env:VAULT_SECRET_ID
