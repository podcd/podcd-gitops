apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-dev
spec:
  provider:
    vault:
      server: http://127.0.0.1:8200
      kvVersion: 2
      auth:
        tokenSecretRef:
          name: env:VAULT_TOKEN   # resolved from agent.env, never stored in Git
---
# The same Vault, reached with the auth method you would use outside a dev box:
# a role id and a secret id instead of a token that never expires and can read
# everything. Both are references resolved from agent.env, so neither the
# credentials nor the secrets they unlock are ever in Git.
#
# pod-with-secret-from-vault.yaml fetches through this store while demo-db and
# demo-api still use the token above, so one reconcile exercises both auth
# methods.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-approle
spec:
  provider:
    vault:
      server: http://127.0.0.1:8200
      kvVersion: 2
      # caCert: /etc/pki/vault-ca.pem   # for a private CA
      auth:
        appRole:
          roleId: env:VAULT_ROLE_ID
          secretRef:
            name: env:VAULT_SECRET_ID
