# Vault dev server managed by podcd.
# The vault-seed sidecar waits for Vault to pass its readiness check, then
# writes the demo secrets and sets up the AppRole once. A dev-server restart
# wipes the in-memory store, so the sidecar redoes both automatically.
#
# Pin images to digests in production: docker.io/hashicorp/vault@sha256:...
apiVersion: v1
kind: Pod
metadata:
  name: vault-dev
spec:
  restartPolicy: Always
  volumes:
    # A shared pre-start marker makes this a useful init-container example even
    # though the dev server itself uses in-memory storage.
    - name: bootstrap
      emptyDir: {}
  initContainers:
    # This completes before Vault and vault-seed start. Its exited (0) state is
    # expected; API-dependent seeding happens in the sidecar below.
    - name: vault-init
      image: docker.io/library/busybox:1.36
      volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
      command:
        - sh
        - -ec
        - |
          printf 'dummy test init container vault-dev bootstrap complete\n' > /bootstrap/ready
          echo "Vault pre-start initialization complete"

  containers:
    - name: vault
      image: docker.io/hashicorp/vault:1.17
      args:
        - server
        - -dev
        - -dev-root-token-id=dev-root-token
        - -dev-listen-address=0.0.0.0:8200
      env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          value: dev-root-token
      volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
      ports:
        - containerPort: 8200
          hostPort: 8200
          hostIP: 127.0.0.1
      livenessProbe:
        httpGet:
          path: /v1/sys/health
          port: 8200
        periodSeconds: 2
        failureThreshold: 30
    # This cannot be an init container: it needs Vault's API, and regular
    # containers start only after all init containers have exited.
    - name: vault-seed
      image: docker.io/curlimages/curl:8.8.0
      env:
        - name: VAULT_ADDR
          value: http://127.0.0.1:8200
        - name: VAULT_TOKEN
          value: dev-root-token
      volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
      command:
        - sh
        - -ec
        - |
          test -f /bootstrap/ready
          vault_post() {
            curl -sf -X POST "$VAULT_ADDR/v1/$1" \
              -H "X-Vault-Token: $VAULT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$2" >/dev/null
          }

          while true; do
            echo "Waiting for Vault to be ready..."
            until curl -sf "$VAULT_ADDR/v1/sys/health" >/dev/null 2>&1; do
              sleep 2
            done

            echo "Vault ready. Seeding demo secrets..."
            vault_post "secret/data/demo/db" '{"data": {"password": "vault-demo-hunter2", "username": "demo-app"}}'
            vault_post "secret/data/demo/api" '{"data": {"api_key": "vault-demo-api-key-1234", "region": "us-east-1"}}'
            vault_post "secret/data/demo/tls" '{"data": {"certificate": "-----BEGIN CERTIFICATE-----demo-----END CERTIFICATE-----", "private_key": "-----BEGIN PRIVATE KEY-----demo-----END PRIVATE KEY-----", "ca": "-----BEGIN CERTIFICATE-----demo-ca-----END CERTIFICATE-----"}}'

            # Enabling an already-enabled method is harmless; the remaining
            # writes deliberately converge to the same demo credentials.
            vault_post "sys/auth/approle" '{"type": "approle"}' 2>/dev/null || true
            vault_post "sys/policies/acl/podcd-demo" '{"policy": "path \"secret/data/demo/*\" { capabilities = [\"read\"] }"}'
            vault_post "auth/approle/role/podcd-demo" '{"token_policies": "podcd-demo", "token_ttl": "1h", "token_max_ttl": "4h"}'
            vault_post "auth/approle/role/podcd-demo/role-id" '{"role_id": "podcd-demo-role-id"}'
            vault_post "auth/approle/role/podcd-demo/custom-secret-id" '{"secret_id": "podcd-demo-secret-id"}'
            echo "Vault seed and AppRole are ready"

            # A dev Vault has no durable storage. When it disappears, wait for
            # its replacement and converge the seed data again.
            while curl -sf "$VAULT_ADDR/v1/sys/health" >/dev/null 2>&1; do
              sleep 5
            done
            echo "Vault became unavailable; will seed it again after recovery"
          done
