# Vault dev server managed by podcd.
# The vault-seed sidecar waits for Vault to pass its readiness check, then
# writes the demo secrets and sets up the AppRole once. A dev-server restart
# wipes the in-memory store, so the sidecar redoes both automatically.
#
# Pin images to digests in production: docker.io/hashicorp/vault@sha256:...
apiVersion: v1
kind: Pod
metadata:
  name: vault-dev
spec:
  restartPolicy: Always
  containers:
    - name: vault
      image: docker.io/hashicorp/vault:1.17
      args:
        - server
        - -dev
        - -dev-root-token-id=dev-root-token
        - -dev-listen-address=0.0.0.0:8200
      env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          value: dev-root-token
      ports:
        - containerPort: 8200
          hostPort: 8200
          hostIP: 127.0.0.1
      livenessProbe:
        httpGet:
          path: /v1/sys/health
          port: 8200
        periodSeconds: 2
        failureThreshold: 30
    - name: vault-seed
      image: docker.io/curlimages/curl:8.8.0
      env:
        - name: VAULT_ADDR
          value: http://127.0.0.1:8200
        - name: VAULT_TOKEN
          value: dev-root-token
      command:
        - sh
        - -c
        - |
          echo "Waiting for Vault to be ready..."
          until curl -sf "$VAULT_ADDR/v1/sys/health" >/dev/null 2>&1; do
            sleep 2
          done
          echo "Vault ready. Seeding demo secrets..."

          curl -sf -X POST "$VAULT_ADDR/v1/secret/data/demo/db" \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"data": {"password": "vault-demo-hunter2", "username": "demo-app"}}'

          curl -sf -X POST "$VAULT_ADDR/v1/secret/data/demo/api" \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"data": {"api_key": "vault-demo-api-key-1234", "region": "us-east-1"}}'

          # Stand-ins, not real PEM: the point is that the bytes arrive as files.
          curl -sf -X POST "$VAULT_ADDR/v1/secret/data/demo/tls" \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"data": {"certificate": "-----BEGIN CERTIFICATE-----demo-----END CERTIFICATE-----", "private_key": "-----BEGIN PRIVATE KEY-----demo-----END PRIVATE KEY-----", "ca": "-----BEGIN CERTIFICATE-----demo-ca-----END CERTIFICATE-----"}}'

          echo "Seeded: secret/demo/db (password, username), secret/demo/api (api_key, region), secret/demo/tls (certificate, private_key, ca)"

          # --- AppRole, so the example exercises the auth method you would
          # actually use rather than only the root token. ---
          #
          # The role id and secret id are pinned. A dev Vault keeps everything in
          # memory, so a pod restart wipes the auth method along with the
          # secrets; fixing both halves means the values you paste into agent.env
          # stay valid across restarts. Never pin them anywhere real - the
          # AppRole section of the README covers how this is done properly.
          vault_post() {
            curl -sf -X POST "$VAULT_ADDR/v1/$1" \
              -H "X-Vault-Token: $VAULT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$2" >/dev/null
          }

          echo "Configuring AppRole..."
          # Already-enabled is not an error on a re-seed.
          vault_post "sys/auth/approle" '{"type": "approle"}' 2>/dev/null || true

          # Read-only, and only the paths this example uses. KV v2 stores values
          # under <mount>/data/<path>, which is why the policy says data/.
          vault_post "sys/policies/acl/podcd-demo" \
            '{"policy": "path \"secret/data/demo/*\" { capabilities = [\"read\"] }"}'

          vault_post "auth/approle/role/podcd-demo" \
            '{"token_policies": "podcd-demo", "token_ttl": "1h", "token_max_ttl": "4h"}'

          vault_post "auth/approle/role/podcd-demo/role-id" \
            '{"role_id": "podcd-demo-role-id"}'

          vault_post "auth/approle/role/podcd-demo/custom-secret-id" \
            '{"secret_id": "podcd-demo-secret-id"}'

          echo "AppRole ready: role podcd-demo, policy podcd-demo (read on secret/data/demo/*)"
          # Keep running so the pod stays healthy; re-seeds on pod restart.
          sleep infinity
