# Vault dev server managed by podcd.
# The vault-seed sidecar keeps the demo secrets and the AppRole present: every
# few seconds it reads them back and writes them again if any are missing. A
# dev server keeps everything in memory, so a restart - a reboot, a crash, a
# reconcile - empties it, and this is what refills it.
#
# Pin images to digests in production: docker.io/hashicorp/vault@sha256:...
apiVersion: v1
kind: Pod
metadata:
  name: vault-dev
spec:
  restartPolicy: Always
  volumes:
    # A shared pre-start marker makes this a useful init-container example even
    # though the dev server itself uses in-memory storage.
    - name: bootstrap
      emptyDir: {}
  initContainers:
    # This completes before Vault and vault-seed start. Its exited (0) state is
    # expected; API-dependent seeding happens in the sidecar below.
    - name: vault-init
      image: docker.io/library/busybox:1.36
      volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
      command:
        - sh
        - -ec
        - |
          printf 'dummy test init container vault-dev bootstrap complete\n' > /bootstrap/ready
          echo "Vault pre-start initialization complete"

  containers:
    - name: vault
      image: docker.io/hashicorp/vault:1.17
      args:
        - server
        - -dev
        - -dev-root-token-id=dev-root-token
        - -dev-listen-address=0.0.0.0:8200
      env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          value: dev-root-token
      volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
      ports:
        - containerPort: 8200
          hostPort: 8200
          hostIP: 127.0.0.1
      # An httpGet probe runs curl inside the container under podman, and this
      # image has none - only busybox wget - so the probe would fail forever
      # and restart Vault every failureThreshold*periodSeconds.
      livenessProbe:
        exec:
          command: [wget ,--no-verbose, --tries=1, --spider, http://127.0.0.1:8200/v1/sys/health,"||", exit, "1"]
        periodSeconds: 2
        failureThreshold: 30
    # This cannot be an init container: it needs Vault's API, and regular
    # containers start only after all init containers have exited.
    - name: vault-seed
      image: docker.io/curlimages/curl:8.8.0
      env:
        - name: VAULT_ADDR
          value: http://127.0.0.1:8200
        - name: VAULT_TOKEN
          value: dev-root-token
      volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
      command:
        - sh
        - -ec
        - |
          test -f /bootstrap/ready

          vault_post() {
            curl -sf -X POST "$VAULT_ADDR/v1/$1" \
              -H "X-Vault-Token: $VAULT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$2" >/dev/null
          }
          vault_get() {
            curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/$1" >/dev/null
          }

          # Every write converges to the same value, so running this against a
          # Vault that is already seeded changes nothing.
          seed() {
            vault_post "secret/data/demo/db" '{"data": {"password": "vault-demo-hunter2", "username": "demo-app"}}'
            vault_post "secret/data/demo/api" '{"data": {"api_key": "vault-demo-api-key-1234", "region": "us-east-1"}}'
            vault_post "secret/data/demo/tls" '{"data": {"certificate": "-----BEGIN CERTIFICATE-----demo-----END CERTIFICATE-----", "private_key": "-----BEGIN PRIVATE KEY-----demo-----END PRIVATE KEY-----", "ca": "-----BEGIN CERTIFICATE-----demo-ca-----END CERTIFICATE-----"}}'
            # Enabling an already-enabled method is a 400; that is fine.
            vault_post "sys/auth/approle" '{"type": "approle"}' 2>/dev/null || true
            vault_post "sys/policies/acl/podcd-demo" '{"policy": "path \"secret/data/demo/*\" { capabilities = [\"read\"] }"}'
            vault_post "auth/approle/role/podcd-demo" '{"token_policies": "podcd-demo", "token_ttl": "1h", "token_max_ttl": "4h"}'
            vault_post "auth/approle/role/podcd-demo/role-id" '{"role_id": "podcd-demo-role-id"}'
            vault_post "auth/approle/role/podcd-demo/custom-secret-id" '{"secret_id": "podcd-demo-secret-id"}'
          }

          # What the demo needs to exist. Checked by reading it back, not by
          # remembering that we wrote it: a restart between two polls, or a
          # hand deletion, leaves Vault empty without ever looking down.
          seeded() {
            vault_get "secret/data/demo/db" &&
            vault_get "secret/data/demo/api" &&
            vault_get "secret/data/demo/tls" &&
            vault_get "auth/approle/role/podcd-demo/role-id"
          }

          while true; do
            if ! curl -sf "$VAULT_ADDR/v1/sys/health" >/dev/null 2>&1; then
              echo "Vault is not answering; waiting"
            elif seeded; then
              :
            else
              echo "Demo secrets or AppRole missing; seeding Vault"
              seed && echo "Vault seed and AppRole are ready"
            fi
            sleep 5
          done
