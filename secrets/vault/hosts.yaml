# Two stages, because the secrets have to exist before anything can read them.
#   1. vault-dev alone: its sidecar seeds the secrets and sets up the AppRole.
#   2. paste the credentials into agent.env (README step 3), uncomment the two
#      apps below, and reconcile again.
apiVersion: gitops.podcd.io/v1
kind: Host
metadata:
  name: local
spec:
  applications:
    - vault-dev
    - demo-app       # secrets as environment variables
    - demo-tls-app   # secrets as mounted files
