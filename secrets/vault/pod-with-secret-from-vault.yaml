# Secrets from Vault delivered as files rather than environment variables.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-tls
spec:
  # Fetched with AppRole, while demo-db and demo-api still use the root token,
  # so one reconcile exercises both auth methods.
  secretStoreRef:
    name: vault-approle
  target:
    name: demo-tls-material   # the name the Pod below references
  data:
    - secretKey: tls.crt
      remoteRef:
        key: secret/demo/tls
        property: certificate
    - secretKey: tls.key
      remoteRef:
        key: secret/demo/tls
        property: private_key
    - secretKey: ca.crt
      remoteRef:
        key: secret/demo/tls
        property: ca
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-tls-app
spec:
  restartPolicy: Always
  volumes:
    - name: tls
      secret:
        secretName: demo-tls-material
  containers:
    - name: demo
      image: docker.io/library/busybox:1.36
      volumeMounts:
        - name: tls
          mountPath: /run/secrets/tls
          readOnly: true
      env:
        # One key as a variable; the rest stay on disk.
        - name: TLS_CA
          valueFrom:
            secretKeyRef:
              name: demo-tls-material
              key: ca.crt
      command:
        - sh
        - -c
        - |
          echo "=== tls material from vault ==="
          for f in /run/secrets/tls/*; do
            echo "$(basename "$f"): $(wc -c < "$f") bytes"
          done
          echo "TLS_CA set: $(test -n "$TLS_CA" && echo yes || echo NO)"
          sleep 3600
