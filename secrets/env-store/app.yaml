apiVersion: v1
kind: Pod
metadata:
  name: demo-app
spec:
  restartPolicy: Always
  containers:
    # Pin to a digest in production: docker.io/library/busybox@sha256:...
    - name: demo
      image: docker.io/library/busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "=== secrets received ==="
          echo "DB_PASSWORD set: $(test -n "$DB_PASSWORD" && echo yes || echo NO)"
          echo "API_TOKEN  set: $(test -n "$API_TOKEN"   && echo yes || echo NO)"
          sleep 3600
      envFrom:
        - secretRef:
            name: app-secrets
