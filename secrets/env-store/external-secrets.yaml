apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  secretStoreRef:
    name: local-env
  target:
    name: app-secrets       # the v1/Secret name the pod references
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: DEMO_DB_PASSWORD   # environment variable name in agent.env
    - secretKey: API_TOKEN
      remoteRef:
        key: DEMO_API_TOKEN
