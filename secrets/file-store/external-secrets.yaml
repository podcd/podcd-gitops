apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  secretStoreRef:
    name: local-files
  target:
    name: app-secrets
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: db_password      # filename under /run/secrets/demo
    - secretKey: API_TOKEN
      remoteRef:
        key: api_token
  # To load every file in the directory at once, use dataFrom instead:
  # dataFrom:
  #   - extract:
  #       key: /run/secrets/demo   # each filename becomes a Secret key
